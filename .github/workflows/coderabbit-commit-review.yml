name: CodeRabbit Automated Review

on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:
    inputs:
      review_mode:
        description: 'Review Scope: full (entire repository) or commit (latest commit & affected files)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - commit

jobs:
  review:
    name: CodeRabbit Automated Review
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CodeRabbit CLI
        run: |
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.coderabbit/bin" >> $GITHUB_PATH

      - name: Run CodeRabbit Review
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
          INPUT_MODE: ${{ inputs.review_mode }}
        run: |
          # Currently set to 'full' for the initial full repository review.
          # Set REVIEW_MODE="commit" to review only the latest commit and affected files.
          REVIEW_MODE="${INPUT_MODE:-full}"

          if [ "$REVIEW_MODE" = "full" ]; then
            echo "Executing full repository review..."
            # 4b825dc642cb6eb9a060e54bf8d69288fbee4904 represents the empty git tree (compares entire repo state)
            BASE_REF="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          else
            echo "Executing commit-level review (HEAD~1 vs HEAD)..."
            BASE_REF="HEAD~1"
          fi

          echo "Reviewing against base reference: $BASE_REF"
          cr review --base "$BASE_REF" --plain > review_output.md || true

          cat review_output.md

      - name: Publish Review to GitHub Action Summary (UI)
        if: always()
        run: |
          echo "## 🤖 CodeRabbit Review Summary" >> $GITHUB_STEP_SUMMARY
          if [ -s review_output.md ]; then
            cat review_output.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No issues or significant changes detected." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Review as Commit Comment
        if: always()
        uses: peter-evans/commit-comment@v3
        with:
          body-path: review_output.md
